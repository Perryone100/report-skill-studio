[project]
name = "report-skill-server"
version = "0.1.0"
description = "Local API for Report Skill Studio"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
  "report-skill-engine",
  "report-skill-renderer",
]

[tool.uv.sources]
report-skill-engine = { workspace = true }
report-skill-renderer = { workspace = true }

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]
pdf = ["report-skill-renderer[pdf]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/report_skill_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
