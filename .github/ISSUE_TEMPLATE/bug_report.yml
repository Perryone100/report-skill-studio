name: Bug report
description: Report a reproducible product defect using synthetic data
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, transcripts, reports, or security vulnerabilities. Report vulnerabilities privately through SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.4.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use fictional or redacted sample content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal information, transcripts, and private reports.
          required: true
